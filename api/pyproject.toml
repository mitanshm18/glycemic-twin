[project]
name = "twin-api"
version = "0.1.0"
description = "PostgreSQL + FastAPI backend (M5): serves the Digital Twin engine from twin_core"
requires-python = ">=3.11"
dependencies = [
    "twin-core",
    "twin-ml",                  # loads the M3 model bundles (joblib) and reads M1/M2 artifacts
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36,<2.2",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "cryptography>=45",         # Argon2id (derive_phc_encoded / verify_phc_encoded)
    "uvicorn>=0.32",
]

[project.scripts]
twin-api = "twin_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_api"]
