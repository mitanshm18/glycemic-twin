[project]
name = "glycemic-digital-twin"
version = "0.1.0"
description = "Personal glycemic digital twin built on CGMacros v1.0.0"
requires-python = ">=3.11"
dependencies = ["twin-core", "twin-ml", "twin-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/twin_core", "ml", "api"]

[tool.uv.sources]
twin-core = { workspace = true }
twin-ml = { workspace = true }
twin-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx>=0.27",              # FastAPI TestClient on Starlette < 1.7
    "httpx2>=2.0.0",            # FastAPI TestClient on Starlette >= 1.7 (httpx there is deprecated)
]

[tool.pytest.ini_options]
testpaths = ["packages/twin_core/tests", "ml/tests", "api/tests"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/reference"]  # archived Phase 0A script, kept verbatim

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD"]
# E501: `ruff format` owns line length; long comment/docstring lines are allowed.
# PD008/PD101: .at is used for scalar access; nunique(dropna=False) is needed for NaN-aware checks.
ignore = ["PD011", "E501", "PD008", "PD101"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
follow_untyped_imports = true  # types-PyYAML (dev group) is used when installed
ignore_missing_imports = true
