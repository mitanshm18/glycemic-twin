[project]
name = "twin-core"
version = "0.1.0"
description = "Pure-Python rules shared by training and serving: cleaning, labels, features, personalization, Digital Twin engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_core"]
